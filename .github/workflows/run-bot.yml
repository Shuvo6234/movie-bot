name: Movie Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # every hour, at minute 0

concurrency:
  group: movie-bot
  cancel-in-progress: false   # let a running job finish; don't kill mid-process

jobs:
  movie-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: /usr/bin/ffmpeg
          key: ffmpeg-${{ runner.os }}-v1

      - name: Install FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            google-genai \
            google-auth \
            google-api-python-client \
            google-auth-httplib2 \
            google-auth-oauthlib

      - name: Cache llama.cpp binary and local model
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin
            ~/.cache/llama.cpp
          key: llama-qwen3vl-${{ runner.os }}-v1
          restore-keys: |
            llama-qwen3vl-${{ runner.os }}-

      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Run Movie Bot
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          DRIVE_INPUT_FOLDER_ID: ${{ secrets.DRIVE_INPUT_FOLDER_ID }}

          VCDN_API_KEY: ${{ secrets.VCDN_API_KEY }}

          GEMINI_MODEL: gemini-3.6-flash
          RESOLUTIONS: 720,1080
          MAX_VIDEOS: 1
          PUBLISH: false
          LANGUAGE_HINT: ""
          AUDIO_MINUTES: 10
          SCREENSHOTS: 6
          WAIT_SECONDS: 20
          DIRECTOR_NAME: ""

        run: |
          python bot.py

      - name: Save llama.cpp cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.local/bin
            ~/.cache/llama.cpp
          key: llama-qwen3vl-${{ runner.os }}-v1
