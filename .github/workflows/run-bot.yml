name: Movie Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: movie-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  movie-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Restore Local AI cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin
            ~/.cache/movie-bot/llama
          key: movie-bot-local-ai-v3-${{ runner.os }}-x64-qwen3-vl-4b
          restore-keys: |
            movie-bot-local-ai-v3-${{ runner.os }}-x64-qwen3-vl-4b
            movie-bot-local-ai-v3-${{ runner.os }}-x64-

      - name: Prepare Local AI cache
        run: |
          mkdir -p "$HOME/.local/bin"
          mkdir -p "$HOME/.cache/movie-bot/llama"

      - name: Install FFmpeg if needed
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "FFmpeg already available."
          else
            echo "Installing FFmpeg..."
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check environment
        run: |
          echo "Python:"
          python --version

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "FFprobe:"
          ffprobe -version | head -n 1

          echo "Repository:"
          ls -la

          echo "Local AI cache:"
          ls -lah "$HOME/.cache
