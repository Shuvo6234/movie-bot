      - name: Check environment
        run: |
          echo "Python:"
          python --version

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "FFprobe:"
          ffprobe -version | head -n 1

          echo "Repository:"
          ls -la

          echo "Local AI cache:"
          ls -lah "$HOME/.cache/movie-bot/llama" || true

          echo "Local binaries:"
          ls -lah "$HOME/.local/bin" || true
