# Save as .github/workflows/<your-file>.yml  (replace your current workflow)
name: Movie Bot

on:
  workflow_dispatch:
    inputs:
      attempt:
        description: "Resume attempt number (set automatically)"
        default: "1"
  schedule:
    - cron: "0 * * * *"   # every hour, at minute 0

permissions:
  contents: write   # commit the state/ folder
  actions: write    # re-trigger this workflow

concurrency:
  group: movie-bot
  cancel-in-progress: false   # let a running job finish; don't kill mid-process

jobs:
  movie-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # a bit under 360 so the save/restart steps can still run

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: /usr/bin/ffmpeg
          key: ffmpeg-${{ runner.os }}-v1

      - name: Install FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            google-genai \
            google-auth \
            google-api-python-client \
            google-auth-httplib2 \
            google-auth-oauthlib \
            internetarchive

      - name: Cache llama.cpp binary and local model
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin
            ~/.cache/llama.cpp
          key: llama-qwen3vl-${{ runner.os }}-v1
          restore-keys: |
            llama-qwen3vl-${{ runner.os }}-

      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Run Movie Bot
        id: bot
        env:
          IA_ACCESS: ${{ secrets.IA_ACCESS }}
          IA_FILE_EXT: mkv
          IA_SECRET: ${{ secrets.IA_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          DRIVE_INPUT_FOLDER_ID: ${{ secrets.DRIVE_INPUT_FOLDER_ID }}

          VCDN_API_KEY: ${{ secrets.VCDN_API_KEY }}

          GEMINI_MODEL: gemini-3.6-flash
          RESOLUTIONS: 720,1080
          MAX_VIDEOS: 1
          PUBLISH: true
          LANGUAGE_HINT: ""
          AUDIO_MINUTES: 10
          SCREENSHOTS: 6
          WAIT_SECONDS: 20
          DIRECTOR_NAME: ""
          MAX_RUN_MINUTES: 330   # bot won't start a new big step after this

        run: |
          set +e
          # Hard stop at 5h45m (exit 124) so the steps below always get to run.
          timeout 345m python bot.py
          code=$?
          echo "Bot exit code: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save progress (state/)
        if: always()
        run: |
          git config user.name  "movie-bot"
          git config user.email "movie-bot@users.noreply.github.com"
          git add -A state 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "bot state [skip ci]"
            git pull --rebase -q || true
            git push
          fi

      - name: Save llama.cpp cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.local/bin
            ~/.cache/llama.cpp
          key: llama-qwen3vl-${{ runner.os }}-v1

      - name: Continue in a new run
        if: steps.bot.outputs.code == '75' || steps.bot.outputs.code == '124'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="${{ inputs.attempt || '1' }}"
          if [ "$n" -lt 10 ]; then
            echo "Not finished yet -> starting attempt $((n+1))"
            gh workflow run "${{ github.workflow }}" --ref "${{ github.ref_name }}" -f attempt=$((n+1))
          else
            echo "Too many attempts, stopping."
            exit 1
          fi

      - name: Fail on real errors
        if: steps.bot.outputs.code != '0' && steps.bot.outputs.code != '75' && steps.bot.outputs.code != '124'
        run: exit 1
